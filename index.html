<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taman Ucapan | Papan Bunga Jakarta &amp; Tangerang</title>
  <meta name="description" content="Toko papan bunga untuk pernikahan, duka cita, ucapan selamat, dan grand opening. Lihat cabang dan harga, lalu pesan lewat WhatsApp.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%232f7d5b' stroke='%23fff'%3E%3Cellipse cx='16' cy='9' rx='4.8' ry='6.8'/%3E%3Cellipse cx='16' cy='9' rx='4.8' ry='6.8' transform='rotate(72 16 16)'/%3E%3Cellipse cx='16' cy='9' rx='4.8' ry='6.8' transform='rotate(144 16 16)'/%3E%3Cellipse cx='16' cy='9' rx='4.8' ry='6.8' transform='rotate(216 16 16)'/%3E%3Cellipse cx='16' cy='9' rx='4.8' ry='6.8' transform='rotate(288 16 16)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.8' fill='%23f6c445'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menu atas -->
  <header class="kepala">
    <div class="wadah kepala-isi">
      <a class="logo" href="#beranda">
        <svg class="logo-bunga" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="currentColor" stroke="#fff" stroke-width="1">
            <ellipse cx="16" cy="9" rx="4.8" ry="6.8"/>
            <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(72 16 16)"/>
            <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(144 16 16)"/>
            <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(216 16 16)"/>
            <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(288 16 16)"/>
          </g>
          <circle cx="16" cy="16" r="3.8" fill="#f6c445"/>
        </svg>
        <span data-isi="nama">Taman Ucapan</span>
      </a>
      <nav class="menu" aria-label="Menu utama">
        <a href="#tentang">( Tentang )</a>
        <a href="#cabang">( Cabang &amp; Harga )</a>
        <a href="#galeri">( Galeri )</a>
        <a href="#lowongan">( Kerja Bersama Kami )</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Pembuka -->
    <section id="beranda" class="pembuka">
      <div class="wadah pembuka-isi">
        <div class="pembuka-teks">
          <p class="label" id="pembuka-label"></p>
          <h1 id="pembuka-judul"></h1>
          <p class="pembuka-sub" id="pembuka-sub"></p>
          <div class="tombol-baris">
            <a class="tombol tombol-utama" href="#cabang">Pesan Sekarang</a>
            <a class="tombol" href="#galeri">Lihat Galeri</a>
          </div>
        </div>
        <div class="pembuka-gambar" id="pembuka-gambar"></div>
      </div>
    </section>

    <!-- Tentang kami -->
    <section id="tentang" class="bagian">
      <div class="wadah dua-kolom">
        <p class="label">( Tentang Kami )</p>
        <div class="tentang-teks" id="tentang-teks"></div>
      </div>
    </section>

    <!-- Cabang dan harga -->
    <section id="cabang" class="bagian bagian-hijau">
      <div class="wadah">
        <p class="label">( Cabang &amp; Harga )</p>
        <h2>Semua cabang <span data-isi="nama">Taman Ucapan</span></h2>
        <div class="daftar-cabang" id="daftar-cabang"></div>
      </div>
    </section>

    <!-- Galeri -->
    <section id="galeri" class="bagian">
      <div class="wadah">
        <p class="label">( Galeri )</p>
        <h2>Contoh papan buatan kami</h2>
        <div class="galeri" id="daftar-galeri"></div>
      </div>
    </section>

    <!-- Lowongan kerja -->
    <section id="lowongan" class="bagian bagian-hijau">
      <div class="wadah dua-kolom">
        <div>
          <p class="label">( Kerja Bersama Kami )</p>
          <h2>Tumbuh bersama tim <span data-isi="nama">Taman Ucapan</span></h2>
        </div>
        <div class="lowongan-teks" id="lowongan-teks"></div>
      </div>
    </section>
  </main>

  <!-- Bagian bawah -->
  <footer class="kaki">
    <div class="wadah">
      <div class="kaki-atas">
        <a class="logo" href="#beranda">
          <svg class="logo-bunga" viewBox="0 0 32 32" aria-hidden="true">
            <g fill="currentColor" stroke="#245f46" stroke-width="1">
              <ellipse cx="16" cy="9" rx="4.8" ry="6.8"/>
              <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(72 16 16)"/>
              <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(144 16 16)"/>
              <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(216 16 16)"/>
              <ellipse cx="16" cy="9" rx="4.8" ry="6.8" transform="rotate(288 16 16)"/>
            </g>
            <circle cx="16" cy="16" r="3.8" fill="#f6c445"/>
          </svg>
          <span data-isi="nama">Taman Ucapan</span>
        </a>
        <nav class="sosmed" id="sosmed" aria-label="Media sosial"></nav>
      </div>
      <p class="hak" id="hak-cipta"></p>
    </div>
  </footer>

  <noscript><p class="tanpa-js">Nyalakan JavaScript supaya isi website tampil.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
